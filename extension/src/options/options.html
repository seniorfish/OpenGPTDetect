<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>PPL 热力图 — 设置</title>
    <link rel="stylesheet" href="options.css" />
    <script src="../shared/defaults.js"></script>
  </head>
  <body>
    <h1>PPL 热力图 · 设置</h1>

    <div class="toolbar">
      <button id="save">保存设置</button>
      <button id="reset" class="danger">恢复默认</button>
      <span id="toast"></span>
    </div>

    <form id="form">
      <fieldset>
        <legend>通用</legend>
        <label><input type="checkbox" id="enabled" /> 启用扩展</label>
        <label><input type="checkbox" id="shortcutEnabled" /> 启用快捷键开关（Ctrl+Shift+L）</label>
      </fieldset>

      <fieldset>
        <legend>API 服务</legend>
        <label>Base URL <input type="text" id="apiBaseUrl" /></label>
      </fieldset>

      <fieldset>
        <legend>文本块检测</legend>
        <label>检测范围
          <select id="textBlockMode">
            <option value="article">文章式（p/li/h 标题等，推荐）</option>
            <option value="all">全量可见文本</option>
          </select>
        </label>
        <label>段落字数少于该值不测量 <input type="number" id="minParagraphChars" min="0" /></label>
        <label><input type="checkbox" id="mergeAdjacentShortParagraphs" /> 合并相邻短段落</label>
        <label>合并上限（单块字符） <input type="number" id="mergeMaxGapChars" min="0" /></label>
        <label>单页最大测量块数 <input type="number" id="maxBlocksPerPage" min="0" /></label>
      </fieldset>

      <fieldset>
        <legend>语言判定</legend>
        <label>英文字符占比 ≥ 此值视为英文段（0-1） <input type="number" id="englishCharRatioThreshold" step="0.05" min="0" max="1" /></label>
        <p class="hint">中文 AI &lt; 18，高质量 35–50，难读 &gt; 50；英文 AI &lt; 6，高质量 18–25，难读 &gt; 25。</p>
      </fieldset>

      <fieldset>
        <legend>字数切分</legend>
        <label>单次请求最大字符数（超过则按句切分，防 OOM） <input type="number" id="maxCharsPerRequest" min="100" /></label>
      </fieldset>

      <fieldset>
        <legend>视口与加载</legend>
        <label>加载时立刻从头测量词数 <input type="number" id="initialMeasureWords" min="0" /></label>
        <label>并发请求数（保护显存） <input type="number" id="measureConcurrency" min="1" max="8" /></label>
        <label>视口预取半径 <input type="text" id="viewportRootMargin" /></label>
        <label>加载指示
          <select id="loadingIndicator">
            <option value="icon">图标</option>
            <option value="spinner">转圈</option>
            <option value="none">无</option>
          </select>
        </label>
      </fieldset>

      <fieldset>
        <legend>小字标注</legend>
        <label><input type="checkbox" id="showPplLabel" /> 显示平均 ppl 小字标注</label>
        <label>显示标注的段落字数阈值 <input type="number" id="annotateThresholdChars" min="0" /></label>
      </fieldset>

      <fieldset>
        <legend>AI 内容识别</legend>
        <label><input type="checkbox" id="aiDetectEnabled" /> 启用 AI 识别</label>
        <label><input type="checkbox" id="aiTagEnabled" /> 显示「AI?」小标签</label>
        <label><input type="checkbox" id="aiBorderEnabled" /> 左侧边框标记</label>
        <label>边框颜色 <input type="color" id="aiBorderColor" /></label>
        <label>可靠判断最小 token 数 <input type="number" id="aiMinReliableTokens" min="0" /></label>
        <label>可靠判断最小字符数 <input type="number" id="reliableMinChars" min="0" /></label>
        <label>中文 AI 阈值（avg ppl 低于此值） <input type="number" id="aiThresholdZh" step="0.5" min="0" /></label>
        <label>英文 AI 阈值（avg ppl 低于此值） <input type="number" id="aiThresholdEn" step="0.5" min="0" /></label>
      </fieldset>

      <fieldset>
        <legend>热力图</legend>
        <label><input type="checkbox" id="heatmapEnabled" /> 启用热力图</label>
        <label>样式
          <select id="heatmapStyle">
            <option value="background">背景色</option>
            <option value="underline">下划线</option>
            <option value="bottombar">底部色条</option>
          </select>
        </label>
        <label>不透明度 <input type="range" id="heatmapOpacity" min="0.05" max="0.8" step="0.05" /><span id="opacityVal"></span></label>
        <label>平滑模式
          <select id="smoothingMode">
            <option value="token">token 窗口</option>
            <option value="sentence">按句平均</option>
          </select>
        </label>
        <label>token 窗口大小（1=逐 token） <input type="number" id="smoothingWindowSize" min="1" max="9" /></label>
      </fieldset>

      <fieldset>
        <legend>颜色配置（ppl → 颜色锚点，升序）</legend>
        <div class="scale-block">
          <h3>中文</h3>
          <div id="scaleZh" class="scale-rows"></div>
          <div class="scale-preview" id="previewZh"></div>
          <button type="button" data-scale="Zh" class="add-anchor">+ 锚点</button>
        </div>
        <div class="scale-block">
          <h3>英文</h3>
          <div id="scaleEn" class="scale-rows"></div>
          <div class="scale-preview" id="previewEn"></div>
          <button type="button" data-scale="En" class="add-anchor">+ 锚点</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>白名单 / 黑名单</legend>
        <label>模式
          <select id="listMode">
            <option value="off">关闭（所有页面运行）</option>
            <option value="blacklist">黑名单（命中不运行）</option>
            <option value="whitelist">白名单（仅命中运行）</option>
          </select>
        </label>
        <label>白名单（每行一条 host，支持 *.example.com）<textarea id="whitelist" rows="3"></textarea></label>
        <label>黑名单（每行一条 host）<textarea id="blacklist" rows="3"></textarea></label>
      </fieldset>
    </form>

    <script src="options.js"></script>
  </body>
</html>
